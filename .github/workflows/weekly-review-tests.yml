name: Weekly review service

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weekly_review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Run synthetic evaluations
        run: pytest -q -W error -p no:cacheprovider
      - name: Run credential-free reviewer demo
        run: python -m app.demo
